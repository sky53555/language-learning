['I’ve been meaning to call you.','계속 너에게 전화하려고 했어.','/aɪv bɪn ˈmiːnɪŋ tə kɔːl juː/','have been meaning to + 동사원형은 이전부터 하려고 마음먹었던 일을 표현합니다.','계속 전화하려고 생각했어.','이미 전화를 끝냈어.'],

["Please let us know when the order will be ready.","주문 건이 언제 준비되는지 알려주시기 바랍니다.","","간접의문문은 의문사 뒤에 평서문 어순을 써요. when the order will be ready처럼 주어 the order 뒤에 will이 와요.","when the order will be ready","when will the order be ready"],

["さ・し・す・せ・そ","사 · 시 · 스 · 세 · 소","sa · shi · su · se · so","히라가나 さ행이에요. し는 로마자로 shi라고 적어요.","し · shi","し · su"],

["はい。いいえ。","네. 아니요.","hai · iie","はい는 긍정, いいえ는 부정을 나타내는 기본 대답이에요.","はい · 네","はい · 아니요"]

['你好','안녕하세요.','nǐ hǎo · 니 하오','你는 너, 好는 좋다라는 뜻입니다. 3성이 연속되면 첫 3성이 2성처럼 변합니다.','안녕하세요.','잘 가세요.'],

const keys=Object.keys(DB),nav=[['home','⌂','대시보드'],['learn','▤','레슨'],['cards','◇','플래시카드'],['review','↻','오답 복습'],['stats','▥','학습 기록']];
let store={done:{},saved:{},wrong:{},dates:{},lang:'ja'};try{const old=JSON.parse(localStorage.getItem('language-lab-v2'));if(old&&typeof old==='object')store={...store,...old}}catch(e){}
let reviewLanguage=null;
let lang=DB[store.lang]?store.lang:'ja',page='home',unit=0,answer=null,flipped=false,cardIndex=0,filter='all';
const id=(l,i)=>l+'-'+i;const persist=()=>{store.lang=lang;try{localStorage.setItem('language-lab-v2',JSON.stringify(store))}catch(e){}};const all=()=>keys.flatMap(l=>DB[l].units.map((u,i)=>({l,i,u,k:id(l,i)})));const complete=l=>DB[l].units.filter((u,i)=>store.done[id(l,i)]).length;const today=()=>new Date().toLocaleDateString('en-CA');const mark=()=>{store.dates[today()]=true;persist()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,action,cls='secondary')=>'<button class="'+cls+'" data-action="'+action+'">'+label+'</button>';const nextLesson=l=>DB[l].units.findIndex((u,i)=>!store.done[id(l,i)]);
const reviewCount=l=>DB[l].units.filter((u,i)=>store.wrong[id(l,i)]).length;
const progress=l=>Math.round(complete(l)/DB[l].units.length*100);
function navHTML(mobile=false){return nav.map(([k,ico,label])=>'<button class="'+(mobile?'':'nav ')+(page===k?'on':'')+'" data-page="'+k+'">'+(mobile?ico+'<br>':'<span style="font-size:20px">'+ico+'</span> ')+label+'</button>').join('')}
function langHTML(){return '<div class="langs">'+keys.map(l=>'<button class="lang '+(lang===l?'on':'')+'" aria-pressed="'+(lang===l)+'" data-lang="'+l+'"><span class="flag">'+DB[l].flag+'</span><b>'+DB[l].label+'</b><small>'+DB[l].level+'</small></button>').join('')+'</div>'}
function lessonRows(l,subset=null){return '<div class="lessonlist">'+(subset||DB[l].units.map((u,i)=>i)).map(i=>{let u=DB[l].units[i],k=id(l,i);return '<button class="lesson '+(page==='learn'&&lang===l&&unit===i?'active':'')+'" data-open="'+l+':'+i+'"><span><b>'+(i+1)+'. '+esc(u[0])+'</b><small>'+esc(u[1])+'</small></span><span class="chip">'+(store.done[k]?'✓ 완료':'학습')+'</span></button>'}).join('')+'</div>'}
function render(){document.getElementById('desktopNav').innerHTML=navHTML();document.getElementById('mobileNav').innerHTML=navHTML(true);let dates=Object.keys(store.dates).sort().reverse(),streak=0;for(let i=0;i<365;i++){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toLocaleDateString('en-CA');if(store.dates[ds])streak++;else if(i===0)continue;else break}document.getElementById('streak').textContent='🔥 '+streak+' day streak';let v=document.getElementById('view'),d=DB[lang],u=d.units[unit],k=id(lang,unit),html='';
if(page==='home'){
  const next=nextLesson(lang), wrong=reviewCount(lang), done=complete(lang);
  const label=next<0?'첫 레슨 다시 보기':done?'다음 레슨 이어하기':'첫 레슨 시작';
  html='<h1 class="heading" style="margin-top:32px">오늘의 언어 공부</h1><p class="muted">언어를 고르고, 다음 레슨이나 오답 복습을 바로 시작하세요.</p>'+langHTML()+
    '<div class="grid"><section class="card"><h2>'+d.flag+' '+d.label+' · 다음 학습</h2>'+
    (next<0?'<p class="muted">이 언어의 레슨을 모두 완료했어요. 저장한 문장이나 오답으로 복습해 보세요.</p>':
      '<p class="muted">레슨 '+(next+1)+' / '+d.units.length+'</p><div class="bigword">'+esc(d.units[next][0])+'</div>')+
    '<div class="actions">'+btn(label+' →','start','primary')+(wrong?btn('오답 '+wrong+'개 복습','review-language'):'')+'</div></section>'+
    '<section class="card"><h2>언어별 학습 진도</h2>'+keys.map(l=>'<div class="row"><span>'+DB[l].flag+' '+DB[l].label+'</span><span class="tiny">'+complete(l)+' / '+DB[l].units.length+' 완료</span></div><div class="progress"><span style="width:'+progress(l)+'%"></span></div>').join('')+'</section></div>'+
    '<details class="card" style="margin-top:18px"><summary>전체 레슨 목록 · '+d.label+'</summary>'+lessonRows(lang)+'</details>';
}
if(page==='learn'){const choiceOrder=(unit+keys.indexOf(lang))%2?[1,0]:[0,1];html='<div class="eyebrow" style="margin-top:40px">LEARNING PATH</div><h1 class="heading">오늘의 레슨</h1><p class="muted">문장을 읽고, 듣고, 퀴즈로 확인하세요.</p>'+langHTML()+'<div class="grid"><section class="card"><div class="row"><span class="chip">LESSON '+(unit+1)+' / '+d.units.length+'</span><span class="tiny">'+progress(lang)+'% 완료</span></div><div class="progress"><span style="width:'+progress(lang)+'%"></span></div><div class="bigword">'+esc(u[0])+'</div><div class="pron">'+esc(u[2])+'</div><div class="translation">'+esc(u[1])+'</div><div class="explain"><b>Grammar & Usage · 문법과 활용</b><br>'+esc(u[3])+'</div><div class="actions">'+btn('🔊 발음 듣기','speak','primary')+btn(store.saved[k]?'★ 저장됨':'☆ 단어장 저장','save')+'</div></section><section class="card"><h2>✦ Check your understanding</h2><p class="muted">올바른 의미 또는 설명을 골라보세요.</p>'+choiceOrder.map((i,position)=>'<button class="choice '+(answer!==null&&answer===i?(i===0?'correct':'wrong'):'')+'" data-answer="'+i+'">'+(position+1)+'. '+esc(u[4+i])+'</button>').join('')+(answer!==null?'<div class="notice" role="status">'+(answer===0?'✓ 정답입니다! 레슨이 완료되었어요.':'다시 도전해 보세요. 문법 설명을 확인해 보세요.')+'</div>':'')+'<div class="actions">'+(unit+1<d.units.length?btn(answer===0?'다음 레슨 →':'다음 레슨 미리 보기','next',answer===0?'primary':'secondary'):btn('학습 홈으로','home'))+'</div><h3 style="margin-top:30px">레슨 선택</h3><div style="max-height:300px;overflow:auto">'+lessonRows(lang)+'</div></section></div>'}
if(page==='cards'){let items=all().filter(x=>store.saved[x.k]&&(filter==='all'||filter===x.l));if(cardIndex>=items.length)cardIndex=0;let x=items[cardIndex];html='<div class="eyebrow" style="margin-top:40px">VOCABULARY COLLECTION</div><h1 class="heading">나만의 플래시카드</h1><p class="muted">레슨에서 ☆ 버튼을 눌러 문장을 저장하세요.</p><div class="actions">'+btn('전체','filter:all',filter==='all'?'primary':'secondary')+keys.map(l=>btn(DB[l].flag+' '+DB[l].label,'filter:'+l,filter===l?'primary':'secondary')).join('')+'</div>'+(x?'<div class="card" style="margin-top:24px;text-align:center;min-height:280px;display:flex;flex-direction:column;justify-content:center"><span class="eyebrow">CARD '+(cardIndex+1)+' / '+items.length+'</span><div class="bigword">'+esc(flipped?x.u[1]:x.u[0])+'</div><p class="muted">'+(flipped?esc(x.u[3]):'뜻을 떠올린 뒤 뒤집어 보세요.')+'</p><div class="actions" style="justify-content:center">'+btn('↻ 뒤집기','flip','primary')+btn('🔊 듣기','speak-card')+btn('다음 →','next-card')+btn('저장 해제','remove-card')+'</div></div>':'<div class="card empty" style="margin-top:24px">아직 저장된 문장이 없습니다.<br>레슨에서 ☆ 단어장 저장을 눌러주세요.</div>')}
if(page==='review'){let wrong=all().filter(x=>store.wrong[x.k]&&(reviewLanguage===null||x.l===reviewLanguage));html='<div class="eyebrow" style="margin-top:40px">SPACED PRACTICE</div><h1 class="heading">오답 복습</h1><p class="muted">틀린 문제를 다시 풀어 정답을 맞히면 오답 목록에서 사라집니다.</p><div class="actions" style="margin-bottom:16px">'+btn('전체 오답','review-all',reviewLanguage===null?'primary':'secondary')+keys.map(l=>btn(DB[l].flag+' '+DB[l].label,'review:'+l,reviewLanguage===l?'primary':'secondary')).join('')+'</div><div class="card">'+(wrong.length?wrong.map(x=>'<button class="lesson" style="width:100%;margin:8px 0" data-open="'+x.l+':'+x.i+'"><span>'+DB[x.l].flag+' <b>'+esc(x.u[0])+'</b><small>'+esc(x.u[1])+'</small></span><span class="chip">다시 풀기</span></button>').join(''):'<div class="empty">🎉 복습할 오답이 없어요!</div>')+'</div>'}
if(page==='stats'){html='<div class="eyebrow" style="margin-top:40px">LEARNING ANALYTICS</div><h1 class="heading">학습 기록</h1><p class="muted">내가 얼마나 꾸준히 공부했는지 확인하세요.</p><div class="grid"><div class="card"><div class="eyebrow">COMPLETED LESSONS</div><div class="stat">'+all().filter(x=>store.done[x.k]).length+' / '+all().length+'</div><p class="muted">전체 학습 진도</p></div><div class="card"><div class="eyebrow">SAVED & REVIEW</div><div class="stat">'+Object.values(store.saved).filter(Boolean).length+' <span class="muted" style="font-size:16px">저장</span></div><p class="muted">'+Object.values(store.wrong).filter(Boolean).length+'개 오답 복습 대기</p></div></div><div class="card" style="margin-top:18px"><h2>언어별 학습 현황</h2>'+keys.map(l=>'<div class="row" style="margin-top:20px"><b>'+DB[l].flag+' '+DB[l].label+'</b><span>'+complete(l)+' / '+DB[l].units.length+'</span></div><div class="progress"><span style="width:'+progress(l)+'%"></span></div>').join('')+'<p class="tiny">기록은 기기 및 브라우저별로 저장되며 자동 동기화되지 않습니다.</p><div class="actions">'+btn('학습 기록 JSON 내보내기','export')+btn('학습 기록 초기화','reset')+'</div></div>'}
v.innerHTML=html}
function speak(text,l){if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 합성을 지원하지 않습니다.');return}speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(l==='zh'&&text===DB.zh.units[0][0]?'妈，麻，马，骂':text);s.lang=l==='ja'?'ja-JP':l==='zh'?'zh-CN':'en-US';s.rate=l==='en'?.86:.75;speechSynthesis.speak(s)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action;if(b.dataset.page){page=b.dataset.page;if(page==='review')reviewLanguage=null;if(page==='learn')unit=Math.max(0,nextLesson(lang));answer=null;window.scrollTo(0,0)}else if(b.dataset.lang){lang=b.dataset.lang;unit=Math.max(0,nextLesson(lang));answer=null;persist()}else if(b.dataset.open){let p=b.dataset.open.split(':');lang=p[0];unit=+p[1];page='learn';answer=null;persist();window.scrollTo(0,0)}else if(a==='start'){page='learn';unit=Math.max(0,nextLesson(lang));answer=null;window.scrollTo(0,0)}else if(a==='home'){page='home';window.scrollTo(0,0)}else if(a==='review-language'||a==='review-all'||a?.startsWith('review:')){reviewLanguage=a==='review-language'?lang:a==='review-all'?null:a.slice(7);page='review';window.scrollTo(0,0)}else if(a==='next'){unit=Math.min(unit+1,DB[lang].units.length-1);answer=null;window.scrollTo(0,0)}else if(a==='speak'){speak(DB[lang].units[unit][0],lang);return}else if(a==='save'){let k=id(lang,unit);store.saved[k]=!store.saved[k];persist()}else if(b.dataset.answer!==undefined){answer=+b.dataset.answer;let k=id(lang,unit);if(answer===0){store.done[k]=true;delete store.wrong[k]}else store.wrong[k]=true;mark()}else if(a==='flip'){flipped=!flipped}else if(a==='next-card'){cardIndex++;flipped=false}else if(a==='remove-card'){let items=all().filter(x=>store.saved[x.k]&&(filter==='all'||filter===x.l));if(items[cardIndex])delete store.saved[items[cardIndex].k];cardIndex=0;flipped=false;persist()}else if(a==='speak-card'){let items=all().filter(x=>store.saved[x.k]&&(filter==='all'||filter===x.l));if(items[cardIndex])speak(items[cardIndex].u[0],items[cardIndex].l);return}else if(a?.startsWith('filter:')){filter=a.slice(7);cardIndex=0;flipped=false}else if(a==='export'){let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='language-lab-progress.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}else if(a==='reset'){if(!confirm('이 브라우저의 모든 학습 기록을 삭제할까요?'))return;store={done:{},saved:{},wrong:{},dates:{},lang};persist()}else return;render()});render();
</script></body></html>
