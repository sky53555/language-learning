<!doctype html><html lang='ko'><meta charset='utf-8'><title>Language Lab</title><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{font:16px system-ui;background:#f5f7ff;color:#253554;margin:0}main{max-width:880px;margin:auto;padding:32px}h1{font-size:36px}nav{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:13px 18px;background:#e7eaff;color:#415cb4;cursor:pointer;font:inherit}button.active,.primary{background:#5c74dc;color:white}.panel{background:white;border-radius:20px;padding:26px;margin-top:20px;box-shadow:0 8px 30px #1b2e550a}.phrase{font-size:32px;margin:20px 0}.note{color:#61718e;line-height:1.8}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f1f4fc}small{color:#73839e}.bar{background:#edf0f8;border-radius:10px;height:8px;overflow:hidden}.bar span{display:block;height:100%;background:#8093ee}footer{margin-top:24px;color:#8390a6;font-size:13px}@media(max-width:600px){main{padding:17px}h1{font-size:29px}}</style><main><h1>🌏 Language Lab</h1><p>영어는 더 자연스럽게, 일본어와 중국어는 첫걸음부터.</p><nav id='languages'></nav><nav id='sections' style='margin-top:15px'></nav><div id='app'></div><footer>학습 기록은 이 브라우저에 저장됩니다. · Language Lab 2026</footer></main><script>const names={en:'🇬🇧 English · 중급',ja:'🇯🇵 日本語 · 왕초보',zh:'🇨🇳 中文 · 완전 입문'};const lessons={en:[['I’ve been meaning to call you.','계속 너에게 전화하려고 했어.','have been meaning to + 동사원형: 이전부터 하려 했던 일을 말해요.','전화하려고 계속 생각했어.','지금 전화하고 있어.'],['If I had more time, I would travel more.','시간이 더 있다면 여행을 더 많이 할 텐데.','If + 과거형, would + 동사원형: 현재 사실과 다른 가정입니다.','현재 상황에 관한 가정','이미 끝난 여행']],ja:[['こんにちは','안녕하세요.','konnichiwa (곤니치와). 마지막 は는 wa로 발음해요.','안녕하세요.','감사합니다.'],['あ い う え お','아 이 우 에 오','히라가나의 기본 모음 다섯 글자입니다.','히라가나 기본 모음','가타카나 기본 모음'],['ありがとうございます','감사합니다.','arigatou gozaimasu. 정중한 감사 표현이에요.','감사합니다.','잘 자요.']],zh:[['你好','안녕하세요.','nǐ hǎo. 3성이 연속되므로 첫 음절은 2성처럼 발음돼요.','안녕하세요.','안녕히 가세요.'],['mā · má · mǎ · mà','1성 · 2성 · 3성 · 4성','성조가 바뀌면 단어 뜻도 달라질 수 있어요.','네 가지 성조','하나의 성조'],['谢谢','감사합니다.','xièxie. 두 번째 음절은 보통 경성입니다.','감사합니다.','죄송합니다.']]};let lang='ja',section='learn',ix=0,feedback='';let state;try{state=JSON.parse(localStorage.getItem('language-lab-v1'))||{}}catch{state={}}state.done||={};state.words||={};state.wrong||={};const save=()=>localStorage.setItem('language-lab-v1',JSON.stringify(state));function render(){document.getElementById('languages').innerHTML=Object.keys(names).map(k=>`<button data-lang='${k}' class='${lang===k?'active':''}'>${names[k]}</button>`).join('');document.getElementById('sections').innerHTML=[['learn','📖 학습'],['words','★ 단어장'],['review','↻ 오답 복습']].map(([k,n])=>`<button data-section='${k}' class='${section===k?'active':''}'>${n}</button>`).join('');let a=document.getElementById('app'),items=lessons[lang],l=items[ix],key=lang+'-'+ix;if(section==='learn'){let count=items.filter((_,i)=>state.done[lang+'-'+i]).length;a.innerHTML=`<div class='panel'><small>LESSON ${ix+1} / ${items.length} · 완료 ${count}개</small><div class='bar'><span style='width:${count/items.length*100}%'></span></div><div class='phrase'>${l[0]}</div><h3>${l[1]}</h3><div class='note'>${l[2]}</div><p><button class='primary' data-speak='1'>🔊 발음 듣기</button> <button data-save='1'>${state.words[key]?'★ 저장됨':'☆ 단어장 저장'}</button></p></div><div class='panel'><h3>Quick Quiz</h3><p>올바른 표현을 고르세요.</p><button class='option' data-answer='0'>① ${l[3]}</button><button class='option' data-answer='1'>② ${l[4]}</button><p>${feedback}</p><button data-next='1'>다음 학습 →</button></div><div class='panel'>${items.map((x,i)=>`<button data-ix='${i}' style='margin:4px'>${state.done[lang+'-'+i]?'✓ ':''}${i+1}. ${x[0]}</button>`).join('')}</div>`}else{let rows=[];Object.keys(lessons).forEach(k=>lessons[k].forEach((x,i)=>{if(state[section==='words'?'words':'wrong'][k+'-'+i])rows.push({k,i,x})}));a.innerHTML=`<div class='panel'><h2>${section==='words'?'나만의 단어장':'틀린 문제 복습'}</h2>${rows.length?rows.map(({k,i,x})=>`<p><b>${names[k]}</b> · ${x[0]}<br/><small>${x[1]}</small> <button data-open='${k}:${i}'>복습하기</button></p>`).join(''):'아직 항목이 없어요. 학습을 시작해 보세요!'}</div>`}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.lang){lang=d.lang;ix=0;section='learn';feedback=''}else if(d.section){section=d.section}else if(d.ix){ix=+d.ix;feedback=''}else if(d.open){[lang,ix]=d.open.split(':');ix=+ix;section='learn';feedback=''}else if(d.save){let k=lang+'-'+ix;state.words[k]=!state.words[k];save()}else if(d.next){ix=(ix+1)%lessons[lang].length;feedback=''}else if(d.speak){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessons[lang][ix][0]);u.lang=lang==='ja'?'ja-JP':lang==='zh'?'zh-CN':'en-US';u.rate=.8;speechSynthesis.speak(u)}return}else if(d.answer){let k=lang+'-'+ix;if(d.answer==='0'){state.done[k]=true;delete state.wrong[k];feedback='✅ 정답이에요!'}else{state.wrong[k]=true;feedback='다시 도전해 보세요.'}save()}else return;render()});render();</script></html>
